<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#163f35" />
<title>ثانوية مارز الإيمان — المنصة الإدارية</title>
<meta name="description" content="منصة إدارية لثانوية مارز الإيمان: الحضور والغياب، إدارة الطلاب والمعلمين، ولجان الاختبارات." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

<!-- Firebase (compat SDK — works without a build step) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<!-- React + Babel (single-file app, no bundler) -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
  :root{
    --paper:#f6f1e7;
    --paper-2:#fffdf8;
    --paper-3:#efe8d8;
    --ink:#221d18;
    --ink-soft:#6a6055;
    --ink-faint:#9a8f80;
    --brand:#1f5d4f;
    --brand-deep:#163f35;
    --brand-soft:#e6efe9;
    --accent:#c25a34;
    --accent-soft:#f6e3d8;
    --line:#e4dccc;
    --line-strong:#d3c8b2;
    --ok:#2f7d5b;
    --ok-soft:#e3f0e8;
    --danger:#b23a2e;
    --danger-soft:#f6e0dc;
    --warn:#c78a1e;
    --warn-soft:#f7eccf;
    --info:#3d6b8e;
    --info-soft:#e2ebf2;
    --shadow-sm:0 1px 2px rgba(34,29,24,.06);
    --shadow:0 6px 24px -12px rgba(34,29,24,.35);
    --shadow-lg:0 24px 60px -28px rgba(34,29,24,.5);
    --r:14px;
    --r-sm:10px;
  }
  *{box-sizing:border-box}
  html{color-scheme:light}
  html,body{margin:0;padding:0}
  body{
    font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;
    background:var(--paper);
    color:var(--ink);
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    background-image:radial-gradient(circle at 12% -10%, #ffffff8c 0, transparent 45%),
                     radial-gradient(circle at 110% 0%, #e9f0ec66 0, transparent 40%);
    background-attachment:fixed;
  }
  /* Visible keyboard focus for all interactive elements */
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
  .btn:focus-visible,.chk:focus-visible{outline-offset:3px}
  h1,h2,h3,h4,.display{font-family:"El Messiri",serif;font-weight:600;line-height:1.25}
  button{font-family:inherit}
  input,select,textarea{font-family:inherit}
  ::selection{background:var(--brand);color:#fff}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:20px;border:2px solid var(--paper)}

  /* ---------- Layout ---------- */
  .app{display:flex;min-height:100vh}
  .sidebar{
    width:264px;flex-shrink:0;background:var(--brand-deep);
    color:#eef3ef;padding:22px 16px;position:sticky;top:0;height:100vh;
    display:flex;flex-direction:column;gap:6px;overflow-y:auto;
  }
  .brand{display:flex;gap:12px;align-items:center;padding:6px 8px 20px;margin-bottom:8px;border-bottom:1px solid #ffffff1f}
  .brand .seal{
    width:46px;height:46px;border-radius:13px;flex-shrink:0;display:grid;place-items:center;
    background:linear-gradient(150deg,var(--accent),#9c3f22);color:#fff;font-family:"El Messiri";
    font-size:22px;font-weight:700;box-shadow:0 8px 20px -8px #00000066;
  }
  .brand h1{font-size:18px;margin:0;color:#fff}
  .brand span{font-size:12px;color:#ffffff9c;display:block;font-family:"IBM Plex Sans Arabic"}
  .nav-item{
    display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:11px;cursor:pointer;
    color:#d6e0da;font-size:15px;font-weight:500;
    transition:background .16s cubic-bezier(.4,0,.2,1),color .16s cubic-bezier(.4,0,.2,1),box-shadow .16s;
    border:1px solid transparent;position:relative;
    width:100%;text-align:right;font-family:inherit;background:transparent;
  }
  .nav-item:hover{background:#ffffff14;color:#fff}
  .nav-item.active{background:var(--paper);color:var(--brand-deep);font-weight:600;box-shadow:var(--shadow)}
  .nav-item .ic{width:20px;text-align:center;font-size:17px}
  .nav-sep{font-size:11px;color:#ffffff5c;padding:14px 13px 6px;letter-spacing:0;font-weight:600}
  .nav-foot{margin-top:auto;padding-top:14px;border-top:1px solid #ffffff1f;font-size:12px;color:#ffffff85}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:16px 30px;background:#fffdf8cc;backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;
  }
  .topbar .page-title{font-size:23px;margin:0}
  .topbar .sub{font-size:13px;color:var(--ink-soft);margin-top:-2px}
  .content{padding:28px 34px 60px;max-width:1320px;width:100%;margin:0 auto;flex:1}
  @media(min-width:1600px){ .content{max-width:1480px;padding:34px 48px 70px} }

  .userchip{display:flex;align-items:center;gap:10px;background:var(--paper-2);border:1px solid var(--line);
    padding:6px 8px 6px 14px;border-radius:40px;box-shadow:var(--shadow-sm)}
  .userchip .av{width:34px;height:34px;border-radius:50%;background:var(--brand-soft);color:var(--brand-deep);
    display:grid;place-items:center;font-weight:700;font-family:"El Messiri"}
  .userchip .who{font-size:13px;font-weight:600;line-height:1.2}
  .userchip .role{font-size:11px;color:var(--ink-soft)}

  .menu-btn{display:none;background:none;border:1px solid var(--line);border-radius:10px;width:42px;height:42px;
    font-size:20px;cursor:pointer;color:var(--ink)}

  /* ---------- Cards / bits ---------- */
  .card{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm)}
  .card.pad{padding:22px}
  .grid{display:grid;gap:18px}
  .section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
  .section-head h2{font-size:22px;margin:0}
  .section-head p{margin:2px 0 0;color:var(--ink-soft);font-size:13.5px}
  .eyebrow{font-size:12px;font-weight:600;color:var(--accent);margin-bottom:4px}

  .btn{
    display:inline-flex;align-items:center;gap:8px;justify-content:center;
    background:var(--brand);color:#fff;border:1px solid var(--brand-deep);
    padding:10px 18px;border-radius:11px;font-size:14.5px;font-weight:600;cursor:pointer;
    transition:transform .14s cubic-bezier(.4,0,.2,1),box-shadow .14s,background .14s;box-shadow:var(--shadow-sm);
  }
  .btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px -8px #1f5d4f88;background:var(--brand-deep)}
  .btn:active{transform:translateY(0)}
  .btn.ghost{background:transparent;color:var(--brand-deep);border-color:var(--line-strong);box-shadow:none}
  .btn.ghost:hover{background:var(--brand-soft)}
  .btn.accent{background:var(--accent);border-color:#9c3f22}
  .btn.accent:hover{background:#a5471f}
  .btn.danger{background:transparent;color:var(--danger);border-color:var(--danger-soft)}
  .btn.danger:hover{background:var(--danger-soft)}
  .btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}

  .field{display:block;margin-bottom:15px}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--ink-soft)}
  .field .hint{font-size:12px;color:var(--ink-faint);margin-top:5px}
  .cv tbody tr{content-visibility:auto;contain-intrinsic-size:auto 49px}
  .input,select.input,textarea.input{
    width:100%;padding:11px 14px;border:1px solid var(--line-strong);border-radius:var(--r-sm);
    background:var(--paper-2);color:var(--ink);font-size:15px;transition:border .15s,box-shadow .15s;
  }
  .input:focus,select.input:focus,textarea.input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}

  .tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:30px;font-size:12.5px;font-weight:600;
    background:var(--paper-3);color:var(--ink-soft);border:1px solid var(--line)}
  .tag.brand{background:var(--brand-soft);color:var(--brand-deep);border-color:#cfe0d7}
  .tag.accent{background:var(--accent-soft);color:#9c3f22;border-color:#eccbba}

  .pill{padding:4px 11px;border-radius:30px;font-size:12.5px;font-weight:600;display:inline-block}
  .pill.present{background:var(--ok-soft);color:var(--ok)}
  .pill.absent{background:var(--danger-soft);color:var(--danger)}
  .pill.late{background:var(--warn-soft);color:#a06e12}
  .pill.excused{background:var(--info-soft);color:var(--info)}

  table.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
  table.tbl th{text-align:right;padding:11px 14px;font-size:12.5px;color:var(--ink-soft);font-weight:600;
    border-bottom:2px solid var(--line);white-space:nowrap}
  table.tbl td{padding:12px 14px;border-bottom:1px solid var(--line)}
  table.tbl tr:last-child td{border-bottom:none}
  table.tbl tbody tr{transition:background .12s}
  table.tbl tbody tr:hover{background:var(--paper)}

  .stat{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r);padding:20px;position:relative;overflow:hidden}
  .stat .k{font-size:13px;color:var(--ink-soft);font-weight:600}
  .stat .v{font-size:32px;font-family:"El Messiri";font-weight:700;margin-top:4px;line-height:1;font-variant-numeric:tabular-nums}
  .stat .foot{font-size:12px;color:var(--ink-faint);margin-top:8px}
  .stat .glyph{position:absolute;left:-6px;top:-10px;font-size:64px;opacity:.06}

  .bar-row{display:flex;align-items:center;gap:12px;margin-bottom:11px;font-size:13.5px}
  .bar-row .lbl{width:120px;flex-shrink:0;color:var(--ink-soft);font-weight:500;text-align:left}
  .bar-track{flex:1;height:12px;background:var(--paper-3);border-radius:20px;overflow:hidden}
  .bar-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--brand),#2c7a68);transition:width .6s cubic-bezier(.2,.7,.2,1)}
  .bar-fill.hot{background:linear-gradient(90deg,var(--accent),#d97a54)}
  .bar-row .num{width:44px;text-align:left;font-weight:700;font-family:"El Messiri";font-variant-numeric:tabular-nums}
  table.tbl td{font-variant-numeric:tabular-nums}

  /* ---------- Modal ---------- */
  .overlay{position:fixed;inset:0;background:#221d1899;backdrop-filter:blur(3px);z-index:100;
    display:flex;align-items:flex-start;justify-content:center;padding:18px 16px;overflow-y:auto;
    overscroll-behavior:contain;animation:fade .18s ease both}
  .modal{background:var(--paper-2);border-radius:18px;box-shadow:var(--shadow-lg);width:100%;max-width:560px;
    border:1px solid var(--line);animation:pop .22s cubic-bezier(.2,.8,.2,1) both;
    display:flex;flex-direction:column;max-height:calc(100vh - 36px);max-height:calc(100dvh - 36px)}
  .modal.wide{max-width:860px}
  .modal-head{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
  .modal-head h3{margin:0;font-size:20px}
  .modal-body{padding:22px 24px;overflow-y:auto;overscroll-behavior:contain;flex:1 1 auto;min-height:0}
  .modal-foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-start;flex-shrink:0}
  .x{background:none;border:none;font-size:22px;cursor:pointer;color:var(--ink-faint);line-height:1;padding:4px}
  .x:hover{color:var(--ink)}

  .empty{text-align:center;padding:50px 20px;color:var(--ink-faint)}
  .empty .big{font-size:46px;opacity:.5;margin-bottom:8px}

  .chk{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid var(--line-strong);
    border-radius:9px;cursor:pointer;font-size:13.5px;background:var(--paper-2);color:var(--ink);font-family:inherit;
    transition:background .13s,border-color .13s,color .13s;margin:0 0 8px 8px}
  .chk:hover{border-color:var(--brand)}
  .chk.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-deep);font-weight:600}
  .chk.disabled{opacity:.4;cursor:not-allowed;text-decoration:line-through}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;
    background:var(--ink);color:#fff;padding:12px 22px;border-radius:12px;font-size:14px;font-weight:500;
    box-shadow:var(--shadow-lg);animation:toastIn .3s cubic-bezier(.2,.8,.2,1) both}
  .toast.ok{background:var(--brand-deep)}
  .toast.err{background:var(--danger)}

  .banner{padding:13px 16px;border-radius:12px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start;margin-bottom:18px}
  .banner.warn{background:var(--warn-soft);color:#8a6410;border:1px solid #ecd28f}
  .banner.info{background:var(--info-soft);color:#2f5573;border:1px solid #c4d6e4}

  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .rise{animation:rise .4s cubic-bezier(.2,.7,.2,1) both}

  /* ---------- Login ---------- */
  .login-wrap{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr}
  .login-art{background:linear-gradient(160deg,var(--brand-deep),#0f2f28);color:#fff;padding:60px 54px;
    display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
  .login-art:after{content:"";position:absolute;inset:0;background:
    radial-gradient(circle at 80% 20%, #c25a3433 0, transparent 45%),
    radial-gradient(circle at 10% 90%, #ffffff12 0, transparent 40%)}
  .login-art .seal-lg{width:74px;height:74px;border-radius:20px;background:linear-gradient(150deg,var(--accent),#9c3f22);
    display:grid;place-items:center;font-family:"El Messiri";font-size:34px;font-weight:700;box-shadow:0 16px 40px -14px #000;z-index:1}
  .login-art h1{font-size:40px;margin:20px 0 10px;z-index:1;position:relative}
  .login-art p{color:#ffffffcc;font-size:16px;max-width:360px;z-index:1;position:relative}
  .login-form{display:grid;place-items:center;padding:40px}
  .login-box{width:100%;max-width:380px;animation:rise .5s ease both}
  @media(max-width:860px){
    .login-wrap{grid-template-columns:1fr}
    .login-art{display:none}
    .sidebar{position:fixed;z-index:60;transform:translateX(100%);transition:transform .25s;box-shadow:var(--shadow-lg)}
    .sidebar.open{transform:none}
    .menu-btn{display:grid;place-items:center}
    .content{padding:20px 16px 50px}
    .topbar{padding:14px 16px}
    .login-form{padding:24px 16px}
  }
  .scrim{display:none}
  .scrim.show{display:block;position:fixed;inset:0;background:#0007;z-index:55}

  /* clickable card as button */
  .qcard{width:100%;text-align:right;font-family:inherit;color:inherit;cursor:pointer;
    transition:transform .15s cubic-bezier(.4,0,.2,1),box-shadow .15s,border-color .15s}
  .qcard:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--line-strong)}
  .qcard:active{transform:translateY(0)}

  /* Respect reduced-motion preference */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;
      transition-duration:.001ms !important;scroll-behavior:auto !important}
    .bar-fill{transition:none}
  }

  /* ---------- Print (PDF export) ---------- */
  @media print{
    body{background:#fff}
    .no-print{display:none !important}
  }
</style>
</head>

<script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* ========================= Storage layer ========================= */
const LS_KEY = "maraz_school_state_v1";
const FB = window.FIREBASE_CONFIG;
const FIREBASE_READY = FB && FB.apiKey && !FB.apiKey.startsWith("PUT_");
const AUTH_DOMAIN_SUFFIX = "@maraz-aliman.app"; // اسم المستخدم يُحوَّل لبريد داخلي
let fdb = null, fauth = null, secApp = null;
if (FIREBASE_READY) {
  try {
    firebase.initializeApp(FB);
    fdb = firebase.firestore();
    fauth = firebase.auth();
    fauth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
  }
  catch(e){ console.warn("Firebase init failed, falling back to local", e); }
}
const userToEmail = u => (u.includes("@") ? u : u.trim().toLowerCase()+AUTH_DOMAIN_SUFFIX);
const USERS_COL = "maraz_users";

// إنشاء حساب عبر تطبيق ثانوي حتى لا يخرج المدير من جلسته
async function createAuthAccount({username,name,role,password}){
  if(!secApp) secApp = firebase.initializeApp(FB, "secondary");
  const secAuth = secApp.auth();
  try{ await secAuth.setPersistence(firebase.auth.Auth.Persistence.NONE); }catch(_){}
  const cred = await secAuth.createUserWithEmailAndPassword(userToEmail(username), password);
  const uid = cred.user.uid;
  await fdb.collection(USERS_COL).doc(uid).set({username:username.trim().toLowerCase(), name:name.trim(), role});
  await secAuth.signOut();
  return uid;
}

const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3);
const todayISO = () => new Date().toISOString().slice(0,10);
const WEEKDAYS = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const weekdayOf = iso => WEEKDAYS[new Date(iso+"T00:00:00").getDay()];
const fmtDate = iso => { try{ return new Intl.DateTimeFormat("ar-SA-u-nu-latn",{day:"numeric",month:"long",year:"numeric"}).format(new Date(iso+"T00:00:00")); }catch(e){ return iso; } };

const SUBJECTS = [
  "التقنية الرقمية","التربية الصحية والبدنية","اللغة الإنجليزية","التفكير الناقد",
  "الرياضيات","الكفايات اللغوية","القرآن الكريم","الكيمياء","الأحياء","الفيزياء",
  "التاريخ","التوحيد","الحديث","الهندسة","الإدارة المالية","مقدمة في الأعمال",
  "الفنون","اللياقة والثقافة الصحية"
];

const DEFAULT_STATE = {
  meta:{ schoolName:"ثانوية مارز الإيمان", sectionsCount:17, absenceThreshold:5 },
  grades:[
    {id:uid(), name:"أول ثانوي", from:1, to:6},
    {id:uid(), name:"ثاني ثانوي", from:7, to:12},
    {id:uid(), name:"ثالث ثانوي", from:13, to:17},
  ],
  users:[
    {id:uid(), username:"admin", password:"1234", role:"manager", name:"مدير الثانوية"},
    {id:uid(), username:"wakeel", password:"1234", role:"deputy", name:"وكيل الشؤون"},
  ],
  teachers:[],
  students:[],
  attendance:{},        // { 'YYYY-MM-DD': { studentId: 'present'|'absent'|'late'|'excused' } }
  attMeta:{},           // { 'YYYY-MM-DD': { studentId: ISOدateTime لوقت التسجيل } }
  records:[],           // [ {id, studentId, kind:'note'|'incident', date, at, by, byName, text, severity} ]
  examSchedules:{},      // { sectionNumber: [ {id,date,subject,time} ] }
  committees:[],         // [ {id,number,subject,date,venue,sectionA,sectionB,studentIds:[],approved} ]
};
const nowISO = () => new Date().toISOString();
const fmtTime = iso => { try{ return new Intl.DateTimeFormat("ar-SA-u-nu-latn",{hour:"2-digit",minute:"2-digit"}).format(new Date(iso)); }catch(e){ return ""; } };

function loadLocal(){
  try{ const s = JSON.parse(localStorage.getItem(LS_KEY)); return s || null; }catch(e){ return null; }
}
function saveLocal(state){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }

/* ========================= App root ========================= */
function useStore(dataReady){
  const [state,setState] = useState(null);

  useEffect(()=>{
    if (fdb){
      if(!dataReady){ setState(null); return; } // انتظر تسجيل الدخول قبل قراءة البيانات
      // في الوضع السحابي: بيانات المدرسة فقط، بدون مستخدمين/كلمات مرور (تُدار عبر Firebase Auth)
      const cloudInit = (()=>{ const {users, ...rest}=DEFAULT_STATE; return rest; })();
      const ref = fdb.collection("maraz").doc("state");
      const unsub = ref.onSnapshot(snap=>{
        if (snap.exists){ const d=snap.data(); if(d.users) delete d.users; setState(d); }
        else { ref.set(cloudInit); setState(cloudInit); }
      }, err=>{ console.warn(err); });
      return unsub;
    } else {
      setState(loadLocal() || DEFAULT_STATE);
    }
  },[dataReady]);

  const commit = useCallback((updater)=>{
    setState(prev=>{
      let next = typeof updater==="function" ? updater(prev) : updater;
      if (fdb){
        if (next.users){ const {users, ...rest}=next; next=rest; } // لا تُخزَّن الحسابات في مستند البيانات
        fdb.collection("maraz").doc("state").set(next).catch(e=>console.warn(e));
      } else {
        saveLocal(next);
      }
      return next;
    });
  },[]);

  return [state, commit];
}

const gradeForSection = (sec, grades) =>
  grades.find(g => sec>=g.from && sec<=g.to) || null;
const gradeName = (sec, grades) => (gradeForSection(sec,grades)||{}).name || "غير مصنّف";
const sectionsRange = count => Array.from({length:count},(_,i)=>i+1);

/* ========================= Toast ========================= */
const ToastCtx = React.createContext(()=>{});
function ToastHost({children}){
  const [t,setT] = useState(null);
  const show = useCallback((msg,type="ok")=>{ setT({msg,type,k:Date.now()}); },[]);
  useEffect(()=>{ if(!t) return; const id=setTimeout(()=>setT(null),2600); return ()=>clearTimeout(id); },[t]);
  return (
    <ToastCtx.Provider value={show}>
      {children}
      <div aria-live="polite" role="status">
        {t && <div key={t.k} className={"toast "+t.type}>{t.msg}</div>}
      </div>
    </ToastCtx.Provider>
  );
}
const useToast = ()=>React.useContext(ToastCtx);

/* ========================= Field (label ↔ control) ========================= */
let _fieldSeq = 0;
function Field({label, hint, children, style}){
  const id = useMemo(()=>"fld_"+(++_fieldSeq),[]);
  const control = React.cloneElement(children, {id, "aria-describedby": hint?id+"_h":undefined});
  return (
    <div className="field" style={style}>
      <label htmlFor={id}>{label}</label>
      {control}
      {hint && <div className="hint" id={id+"_h"}>{hint}</div>}
    </div>
  );
}

/* ========================= Modal ========================= */
function Modal({title, onClose, children, foot, wide}){
  useEffect(()=>{
    const h=e=>{ if(e.key==="Escape") onClose(); };
    window.addEventListener("keydown",h); return ()=>window.removeEventListener("keydown",h);
  },[onClose]);
  return (
    <div className="overlay" onMouseDown={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className={"modal"+(wide?" wide":"")}>
        <div className="modal-head"><h3>{title}</h3><button className="x" aria-label="إغلاق" onClick={onClose}>×</button></div>
        <div className="modal-body">{children}</div>
        {foot && <div className="modal-foot">{foot}</div>}
      </div>
    </div>
  );
}

function Confirm({text, onYes, onClose, danger}){
  return (
    <Modal title="تأكيد" onClose={onClose}
      foot={<>
        <button className={"btn "+(danger?"danger":"")} onClick={()=>{onYes();onClose();}}>نعم، متأكد</button>
        <button className="btn ghost" onClick={onClose}>إلغاء</button>
      </>}>
      <p style={{margin:0,fontSize:15}}>{text}</p>
    </Modal>
  );
}

/* ========================= LOGIN ========================= */
function mapAuthErr(ex){
  const c=(ex&&ex.code)||"";
  if(c.includes("wrong-password")||c.includes("invalid-credential")||c.includes("user-not-found")||c.includes("invalid-login")) return "اسم المستخدم أو كلمة المرور غير صحيحة";
  if(c.includes("too-many-requests")) return "محاولات كثيرة، انتظر قليلاً ثم أعد المحاولة";
  if(c.includes("network")) return "تعذّر الاتصال بالشبكة، تحقّق من الإنترنت";
  return "تعذّر تسجيل الدخول — تأكد من تفعيل المصادقة في Firebase";
}
function Login({localUsers, onLocalLogin, authErr, setAuthErr}){

  const submit=async e=>{
    e.preventDefault(); setErr(""); if(setAuthErr) setAuthErr("");
    if(fauth){
      setBusy(true);
      try{ await fauth.signInWithEmailAndPassword(userToEmail(u), p); }
      catch(ex){ setErr(mapAuthErr(ex)); }
      finally{ setBusy(false); }
    } else {
      const found=(localUsers||[]).find(x=>x.username===u.trim() && x.password===p);
      if(found){ onLocalLogin(found); } else { setErr("اسم المستخدم أو كلمة المرور غير صحيحة"); }
    }
  };
  return (
    <div className="login-wrap">
      <div className="login-art">

        <div>
          <h1>ثانوية مارز الإيمان</h1>

        </div>
        <div style={{color:"#ffffff88",fontSize:13,zIndex:1,position:"relative"}}>
          {FIREBASE_READY ? "متصل بقاعدة بيانات مشتركة" : "وضع تجريبي محلي — لم تُضبط قاعدة البيانات بعد"}
          <div style={{marginTop:4,color:"#ffffff5c",fontSize:12}}>من صنع مصطفى عبدالله أحمد</div>
        </div>
      </div>
      <div className="login-form">
        <form className="login-box" onSubmit={submit}>
          <div className="eyebrow">تسجيل الدخول</div>
          <h2 style={{fontSize:28,margin:"0 0 6px"}}>أهلاً بك</h2>
          <p style={{color:"var(--ink-soft)",marginTop:0,fontSize:14}}>ادخل بيانات حسابك للمتابعة.</p>
          <div className="field">
            <label htmlFor="login-user">اسم المستخدم</label>
            <input id="login-user" name="username" autoComplete="username" className="input" value={u} onChange={e=>setU(e.target.value)} placeholder="admin"/>

            <input id="login-pass" name="password" autoComplete="current-password" className="input" type="password" value={p} onChange={e=>setP(e.target.value)} placeholder="••••"/>
          </div>
          <div aria-live="polite">
            {(err||authErr) && <div style={{color:"var(--danger)",fontSize:13,marginBottom:12}}>{err||authErr}</div>}

            من صنع مصطفى عبدالله أحمد

function Attendance({state, commit, user}){
  const toast=useToast();
  const [date,setDate]=useState(todayISO());
  const [sec,setSec]=useState(1);
  const secs = sectionsRange(state.meta.sectionsCount);
  const roster = state.students.filter(s=>s.section===sec);
  const rec = state.attendance[date] || {};

  const setStatus=(sid,status)=>{
    commit(prev=>{
      const day = {...(prev.attendance[date]||{})}; day[sid]=status;
      const meta = {...((prev.attMeta||{})[date]||{})}; meta[sid]=nowISO();
      return {...prev, attendance:{...prev.attendance, [date]:day}, attMeta:{...(prev.attMeta||{}), [date]:meta}};
    });
  };
  const markAll=status=>{
    commit(prev=>{
      const day={...(prev.attendance[date]||{})};
      const meta={...((prev.attMeta||{})[date]||{})}; const t=nowISO();
      roster.forEach(s=>{ day[s.id]=status; meta[s.id]=t; });
      return {...prev, attendance:{...prev.attendance,[date]:day}, attMeta:{...(prev.attMeta||{}),[date]:meta}};
    });
    toast("تم تحديث الشعبة كاملة");
  };
  const isPast = date < todayISO();

  return (
    <div className="rise">
      <div className="section-head">
        <div><h2>الحضور والغياب</h2><p>سجّل الحضور اليومي، أو عدّل حالة سابقة بأثر رجعي.</p></div>
      </div>

      {isPast && <div className="banner info">✎ أنت تعدّل يوماً سابقاً ({weekdayOf(date)}). يمكنك تغيير أي حالة — مثلاً من «غائب» إلى «غائب بعذر».</div>}

      <div className="card pad" style={{marginBottom:18}}>
        <div style={{display:"flex",gap:16,flexWrap:"wrap",alignItems:"flex-end"}}>
          <Field label="التاريخ" style={{margin:0,minWidth:170}}>
            <input className="input" type="date" value={date} max={todayISO()} onChange={e=>setDate(e.target.value)}/>
          </Field>
          <Field label="الشعبة" style={{margin:0,minWidth:170}}>
            <select className="input" value={sec} onChange={e=>setSec(+e.target.value)}>
              {secs.map(n=><option key={n} value={n}>شعبة {n} — {gradeName(n,state.grades)}</option>)}
            </select>
          </Field>
          <div style={{marginRight:"auto",display:"flex",gap:8}}>
            <button className="btn ghost sm" onClick={()=>markAll("present")} disabled={!roster.length}>تحضير الكل</button>
            <button className="btn ghost sm" onClick={()=>markAll("absent")} disabled={!roster.length}>تغييب الكل</button>
          </div>
        </div>
      </div>

      {roster.length===0
        ? <div className="card"><div className="empty"><div className="big">◉</div>لا يوجد طلاب في شعبة {sec} بعد.<br/><span style={{fontSize:13}}>أضف طلاباً من صفحة «الطلاب».</span></div></div>
        : <div className="card">
            <table className="tbl">
              <thead><tr><th>#</th><th>اسم الطالب</th><th>الحالة</th><th style={{width:"46%"}}>تسجيل</th></tr></thead>
              <tbody>
                {roster.map((s,i)=>{
                  const st=rec[s.id];
                  return <tr key={s.id}>
                    <td style={{color:"var(--ink-faint)"}}>{i+1}</td>
                    <td style={{fontWeight:600}}>{s.name}</td>
                    <td>{st?<span className={"pill "+st}>{statusLabel(st)}</span>:<span style={{color:"var(--ink-faint)",fontSize:13}}>—</span>}</td>
                    <td><div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                      {["present","absent","late","excused"].map(k=>
                        <button key={k} onClick={()=>setStatus(s.id,k)}

          </div>}
    </div>
  );

/* ========================= STATS ========================= */
function Stats({state}){
  const {students,attendance,grades,meta} = state;
  const secOf = {}; students.forEach(s=>secOf[s.id]=s.section);

  const data = useMemo(()=>{
    const perSection={}, perGrade={}, perDay={}, perStudent={};
    let totAbsent=0, totLate=0, totRecords=0;
    Object.entries(attendance).forEach(([date,day])=>{
      const wd=weekdayOf(date);
      Object.entries(day).forEach(([sid,st])=>{
        totRecords++;
        const sec=secOf[sid]; if(sec===undefined) return;
        const g=gradeName(sec,grades);
        if(st==="absent"){
          totAbsent++;
          perSection[sec]=(perSection[sec]||0)+1;
          perGrade[g]=(perGrade[g]||0)+1;
          perDay[wd]=(perDay[wd]||0)+1;
          perStudent[sid]=(perStudent[sid]||0)+1;
        }
        if(st==="late") totLate++;
      });
    });
    return {perSection,perGrade,perDay,perStudent,totAbsent,totLate,totRecords};
  },[attendance,students,grades]);

  const topStudents = Object.entries(data.perStudent)
    .map(([sid,c])=>({name:(students.find(s=>s.id===sid)||{}).name||"—", section:secOf[sid], c}))
    .sort((a,b)=>b.c-a.c);
  const alerts = topStudents.filter(s=>s.c>=meta.absenceThreshold);

  const daySorted = WEEKDAYS.filter(d=>data.perDay[d]).map(d=>({d,c:data.perDay[d]})).sort((a,b)=>b.c-a.c);
  const secSorted = Object.entries(data.perSection).map(([s,c])=>({s:+s,c})).sort((a,b)=>b.c-a.c);
  const gradeSorted = Object.entries(data.perGrade).map(([g,c])=>({g,c})).sort((a,b)=>b.c-a.c);
  const maxDay=Math.max(1,...daySorted.map(x=>x.c));
  const maxSec=Math.max(1,...secSorted.map(x=>x.c));
  const maxGrade=Math.max(1,...gradeSorted.map(x=>x.c));

  if(!data.totRecords) return <div className="card rise"><div className="empty"><div className="big">◔</div>لا توجد بيانات حضور بعد.<br/><span style={{fontSize:13}}>ابدأ بتسجيل الحضور لتظهر الإحصائيات.</span></div></div>;

  return (
    <div className="rise">
      <div className="grid" style={{gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",marginBottom:20}}>
        <Stat k="إجمالي الغياب" v={data.totAbsent} glyph="✕" foot="حالة غياب مسجّلة"/>
        <Stat k="إجمالي التأخير" v={data.totLate} glyph="◔" foot="حالة تأخير"/>
        <Stat k="طلاب فوق الحد" v={alerts.length} glyph="!" foot={`الحد: ${meta.absenceThreshold} غياب`}/>
        <Stat k="أيام مسجّلة" v={Object.keys(attendance).length} glyph="▤" foot="يوم دراسي"/>
      </div>

      {alerts.length>0 &&
        <div className="banner warn">
          <span>⚠</span>
          <div><b>تنبيه: طلاب كثيرو الغياب.</b> {alerts.slice(0,6).map(a=>a.name).join("، ")}{alerts.length>6?` و${alerts.length-6} غيرهم`:""}.</div>
        </div>}

      <div className="grid" style={{gridTemplateColumns:"repeat(auto-fit,minmax(300px,1fr))"}}>
        <div className="card pad">
          <h3 style={{marginTop:0}}>أكثر الأيام غياباً</h3>
          {daySorted.map(x=><Bar key={x.d} label={x.d} val={x.c} max={maxDay} hot={x===daySorted[0]}/>)}
        </div>
        <div className="card pad">
          <h3 style={{marginTop:0}}>أكثر الصفوف غياباً</h3>
          {gradeSorted.map(x=><Bar key={x.g} label={x.g} val={x.c} max={maxGrade} hot={x===gradeSorted[0]}/>)}
        </div>
      </div>

      <div className="grid" style={{gridTemplateColumns:"1fr",marginTop:18}}>
        <div className="card pad">
          <h3 style={{marginTop:0}}>أكثر الشُّعب غياباً</h3>
          {secSorted.slice(0,10).map(x=><Bar key={x.s} label={`شعبة ${x.s} · ${gradeName(x.s,grades)}`} val={x.c} max={maxSec} hot={x===secSorted[0]}/>)}
        </div>
      </div>

      <div className="card" style={{marginTop:18}}>
        <div style={{padding:"18px 22px 0"}}><h3 style={{margin:0}}>الطلاب الأكثر غياباً</h3></div>
        <table className="tbl" style={{marginTop:10}}>
          <thead><tr><th>#</th><th>الطالب</th><th>الشعبة</th><th>الصف</th><th>عدد الغياب</th></tr></thead>
          <tbody>
            {topStudents.slice(0,15).map((s,i)=><tr key={i}>
              <td style={{color:"var(--ink-faint)"}}>{i+1}</td>
              <td style={{fontWeight:600}}>{s.name}</td>
              <td>شعبة {s.section}</td>
              <td>{gradeName(s.section,grades)}</td>
              <td><span className={"pill "+(s.c>=meta.absenceThreshold?"absent":"late")}>{s.c}</span></td>
            </tr>)}
          </tbody>
        </table>
      </div>
    </div>
  );
}
function Bar({label,val,max,hot}){
  return <div className="bar-row">
    <span className="lbl">{label}</span>
    <div className="bar-track"><div className={"bar-fill"+(hot?" hot":"")} style={{width:(val/max*100)+"%"}}/></div>
    <span className="num">{val}</span>
  </div>;
}

/* ========================= MONITOR (مراقبة الغياب) ========================= */
function Monitor({state}){
  const {students,attendance,grades,meta}=state;
  const secs=sectionsRange(meta.sectionsCount);
  const dates=Object.keys(attendance).sort();
  const [from,setFrom]=useState(dates[0]||"");
  const [to,setTo]=useState(dates[dates.length-1]||"");
  const [sortBy,setSortBy]=useState("absent"); // absent | rate
  const [openSec,setOpenSec]=useState(null);

  const per=useMemo(()=>{
    const inRange=d=>(!from||d>=from)&&(!to||d<=to);
    const sa={}; students.forEach(s=>sa[s.id]={absent:0,late:0,excused:0});
    let daysCount=0;
    Object.entries(attendance).forEach(([d,day])=>{
      if(!inRange(d)) return; daysCount++;
      Object.entries(day).forEach(([sid,st])=>{ if(sa[sid]&&sa[sid][st]!==undefined) sa[sid][st]++; });
    });
    const sections=secs.map(sec=>{
      const roster=students.filter(s=>s.section===sec);
      let absent=0,late=0,excused=0;
      roster.forEach(s=>{absent+=sa[s.id].absent;late+=sa[s.id].late;excused+=sa[s.id].excused;});
      const ranked=roster.map(s=>({id:s.id,name:s.name,...sa[s.id]})).sort((a,b)=>b.absent-a.absent||b.late-a.late);
      const possible=roster.length*daysCount;
      const rate=possible?Math.round(absent/possible*100):0;
      return {sec,grade:gradeName(sec,grades),count:roster.length,absent,late,excused,rate,ranked};
    }).filter(x=>x.count>0);
    return {sections,daysCount};
  },[attendance,students,grades,from,to,secs.length]);

  const sorted=per.sections.slice().sort((a,b)=> sortBy==="rate"? b.rate-a.rate : b.absent-a.absent);
  const totAbsent=per.sections.reduce((m,s)=>m+s.absent,0);
  const worst=per.sections.slice().sort((a,b)=>b.absent-a.absent)[0];

  if(!dates.length) return <div className="card rise"><div className="empty"><div className="big">◎</div>لا توجد بيانات حضور بعد.<br/><span style={{fontSize:13}}>سجّل الحضور أولاً لتظهر المراقبة.</span></div></div>;

  return (
    <div className="rise">
      <div className="section-head">
        <div><h2>مراقبة الغياب</h2><p>نِسب الغياب وأكثر الطلاب غياباً في كل فصل، خلال الفترة المحددة.</p></div>
      </div>

      <div className="card pad" style={{marginBottom:18,display:"flex",gap:14,flexWrap:"wrap",alignItems:"flex-end"}}>
        <Field label="من تاريخ" style={{margin:0,minWidth:160}}>
          <input className="input" type="date" value={from} min={dates[0]} max={to||dates[dates.length-1]} onChange={e=>setFrom(e.target.value)}/>
        </Field>
        <Field label="إلى تاريخ" style={{margin:0,minWidth:160}}>
          <input className="input" type="date" value={to} min={from||dates[0]} max={dates[dates.length-1]} onChange={e=>setTo(e.target.value)}/>
        </Field>
        <Field label="الترتيب حسب" style={{margin:0,minWidth:170}}>
          <select className="input" value={sortBy} onChange={e=>setSortBy(e.target.value)}>
            <option value="absent">عدد الغياب</option>
            <option value="rate">نسبة الغياب %</option>
          </select>
        </Field>
        <div style={{marginRight:"auto"}}>
          <button className="btn ghost sm" onClick={()=>{setFrom(dates[0]);setTo(dates[dates.length-1]);}}>كل الفترة</button>
        </div>
      </div>

      <div className="grid" style={{gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",marginBottom:18}}>
        <Stat k="أيام مسجّلة بالفترة" v={per.daysCount} glyph="▤" foot="يوم دراسي"/>
        <Stat k="إجمالي الغياب" v={totAbsent} glyph="✕" foot="خلال الفترة"/>
        <Stat k="فصول تحت المراقبة" v={per.sections.length} glyph="◎" foot="فيها طلاب"/>
        <Stat k="أعلى فصل غياباً" v={worst?`شعبة ${worst.sec}`:"—"} glyph="!" foot={worst?`${worst.absent} غياب`:""}/>
      </div>

      <div className="grid" style={{gridTemplateColumns:"repeat(auto-fit,minmax(320px,1fr))"}}>
        {sorted.map(s=>{
          const maxAbs=Math.max(1,...per.sections.map(x=>x.absent));
          const top=s.ranked.filter(r=>r.absent>0).slice(0,3);
          const isOpen=openSec===s.sec;
          return <div className="card pad" key={s.sec}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div>
                <div className="eyebrow">{s.grade}</div>
                <h3 style={{margin:"2px 0 0",fontSize:19}}>شعبة {s.sec}</h3>
                <div style={{fontSize:12.5,color:"var(--ink-soft)",marginTop:2}}>{s.count} طالب</div>
              </div>
              <div style={{textAlign:"left"}}>
                <div style={{fontFamily:"El Messiri",fontSize:26,fontWeight:700,color:s.rate>=20?"var(--danger)":"var(--brand)",lineHeight:1}}>{s.rate}%</div>
                <div style={{fontSize:11,color:"var(--ink-faint)"}}>نسبة الغياب</div>
              </div>
            </div>

            <div className="bar-row" style={{marginTop:14,marginBottom:6}}>
              <span className="lbl">الغياب</span>
              <div className="bar-track"><div className={"bar-fill"+(s===worst?" hot":"")} style={{width:(s.absent/maxAbs*100)+"%"}}/></div>
              <span className="num">{s.absent}</span>
            </div>
            <div style={{display:"flex",gap:8,fontSize:12.5,color:"var(--ink-soft)",marginBottom:10}}>
              <span className="pill late">تأخير {s.late}</span>
              <span className="pill excused">بعذر {s.excused}</span>
            </div>

            <div style={{fontSize:12.5,fontWeight:600,color:"var(--ink-soft)",marginBottom:6}}>الأكثر غياباً</div>
            {top.length? (isOpen?s.ranked.filter(r=>r.absent>0||r.late>0):top).map((r,i)=>(
              <div key={r.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"5px 0",borderBottom:"1px solid var(--line)"}}>
                <span style={{fontSize:13.5}}><span style={{color:"var(--ink-faint)",marginLeft:6}}>{i+1}.</span>{r.name}</span>
                <span className={"pill "+(r.absent>=meta.absenceThreshold?"absent":"late")}>{r.absent} غياب</span>
              </div>
            )) : <div style={{fontSize:13,color:"var(--ink-faint)"}}>لا غياب مسجّل 👏</div>}

            {s.ranked.filter(r=>r.absent>0).length>3 &&
              <button className="btn ghost sm" style={{marginTop:10}} onClick={()=>setOpenSec(isOpen?null:s.sec)}>
                {isOpen?"عرض أقل":`عرض الكل (${s.ranked.filter(r=>r.absent>0).length})`}
              </button>}
          </div>;
        })}
      </div>
    </div>
  );
}

/* ========================= RECORDS (سجلات الطلاب) ========================= */
function Records({state, commit, user}){
  const [q,setQ]=useState(""); const [fSec,setFSec]=useState("all");
  const [open,setOpen]=useState(null);
  const secs=sectionsRange(state.meta.sectionsCount);
  const list=state.students
    .filter(s=>fSec==="all"||s.section===+fSec)
    .filter(s=>s.name.includes(q.trim()))
    .sort((a,b)=>a.section-b.section||a.name.localeCompare(b.name,"ar"));
  const absCount=sid=>{ let a=0; Object.values(state.attendance).forEach(d=>{ if(d[sid]==="absent") a++; }); return a; };
  const recCount=sid=>(state.records||[]).filter(r=>r.studentId===sid);

  return (
    <div className="rise">
      <div className="section-head">
        <div><h2>سجلات الطلاب</h2><p>السجل الكامل لكل طالب: الحضور والغياب، الملاحظات، والمخالفات/السوابق.</p></div>
      </div>
      <div className="card pad" style={{marginBottom:16,display:"flex",gap:12,flexWrap:"wrap",alignItems:"flex-end"}}>
        <Field label="بحث بالاسم" style={{margin:0,flex:1,minWidth:200}}>
          <input className="input" type="search" value={q} onChange={e=>setQ(e.target.value)} placeholder="اكتب اسم الطالب…"/>
        </Field>
        <Field label="تصفية بالشعبة" style={{margin:0,minWidth:180}}>
          <select className="input" value={fSec} onChange={e=>setFSec(e.target.value)}>
            <option value="all">كل الشُّعب</option>
            {secs.map(n=><option key={n} value={n}>شعبة {n}</option>)}
          </select>
        </Field>
      </div>

      {list.length===0
        ? <div className="card"><div className="empty"><div className="big">▦</div>لا يوجد طلاب.</div></div>
        : <div className="card"><table className="tbl cv">
            <thead><tr><th>#</th><th>الطالب</th><th>الشعبة</th><th>الصف</th><th>الغياب</th><th>ملاحظات/مخالفات</th><th style={{width:1}}></th></tr></thead>
            <tbody>{list.map((s,i)=>{ const a=absCount(s.id); const recs=recCount(s.id); return <tr key={s.id}>
              <td style={{color:"var(--ink-faint)"}}>{i+1}</td>
              <td style={{fontWeight:600}}>{s.name}</td>
              <td><span className="tag brand">شعبة {s.section}</span></td>
              <td>{gradeName(s.section,state.grades)}</td>
              <td>{a?<span className="pill absent">{a}</span>:<span style={{color:"var(--ink-faint)"}}>0</span>}</td>
              <td>{recs.length?<span className="pill late">{recs.length}</span>:<span style={{color:"var(--ink-faint)"}}>0</span>}</td>
              <td><button className="btn ghost sm" onClick={()=>setOpen(s)}>عرض السجل</button></td>
            </tr>; })}</tbody>
          </table></div>}

      {open && <StudentRecord student={open} state={state} commit={commit} user={user} onClose={()=>setOpen(null)}/>}
    </div>
  );
}

function StudentRecord({student, state, commit, user, onClose}){
  const toast=useToast();
  const canManageAtt = user.role==="manager"||user.role==="deputy";
  const canDelRec = r => user.role==="manager"||user.role==="deputy"||r.by===user.id;

  const history=Object.keys(state.attendance)
    .filter(d=>state.attendance[d][student.id]!==undefined)
    .map(d=>({date:d, status:state.attendance[d][student.id], at:((state.attMeta||{})[d]||{})[student.id]}))
    .sort((a,b)=>b.date.localeCompare(a.date));
  const counts={present:0,absent:0,late:0,excused:0}; history.forEach(h=>counts[h.status]!==undefined&&counts[h.status]++);
  const recs=(state.records||[]).filter(r=>r.studentId===student.id).sort((a,b)=>String(b.at||b.date).localeCompare(String(a.at||a.date)));
  const notes=recs.filter(r=>r.kind==="note");
  const incidents=recs.filter(r=>r.kind==="incident");

  const setDay=(date,status)=>commit(p=>{
    const day={...(p.attendance[date]||{})}; day[student.id]=status;
    const meta={...((p.attMeta||{})[date]||{})}; meta[student.id]=nowISO();
    return {...p, attendance:{...p.attendance,[date]:day}, attMeta:{...(p.attMeta||{}),[date]:meta}};
  });
  const delDay=(date)=>commit(p=>{
    const day={...(p.attendance[date]||{})}; delete day[student.id];
    const meta={...((p.attMeta||{})[date]||{})}; delete meta[student.id];
    return {...p, attendance:{...p.attendance,[date]:day}, attMeta:{...(p.attMeta||{}),[date]:meta}};
  });
  const addRec=(rec)=>commit(p=>({...p, records:[...(p.records||[]), {id:uid(), studentId:student.id, date:todayISO(), at:nowISO(), by:user.id, byName:user.name, ...rec}]}));
  const delRec=(id)=>commit(p=>({...p, records:(p.records||[]).filter(r=>r.id!==id)}));

  const [note,setNote]=useState("");
  const [inc,setInc]=useState(""); const [sev,setSev]=useState("mid"); const [itype,setItype]=useState("");

  const H = ({children}) => <h3 style={{fontSize:16,margin:"20px 0 8px"}}>{children}</h3>;

  return (
    <Modal title="سجل الطالب" onClose={onClose} wide
      foot={<>
        <button className="btn ghost" onClick={()=>printStudentRecord(student,state)}>تصدير السجل PDF</button>
        <button className="btn" onClick={onClose}>إغلاق</button>
      </>}>
      <div style={{display:"flex",alignItems:"center",gap:14,flexWrap:"wrap"}}>
        <div className="av" style={{width:50,height:50,borderRadius:14,fontSize:22}}>{student.name.slice(0,1)}</div>
        <div>
          <div style={{fontFamily:"El Messiri",fontSize:20,fontWeight:700}}>{student.name}</div>
          <div style={{fontSize:13,color:"var(--ink-soft)"}}>شعبة {student.section} · {gradeName(student.section,state.grades)}</div>
        </div>
        <div style={{marginRight:"auto",display:"flex",gap:6,flexWrap:"wrap"}}>
          <span className="pill absent">غياب {counts.absent}</span>
          <span className="pill late">تأخير {counts.late}</span>
          <span className="pill excused">بعذر {counts.excused}</span>
          <span className="pill present">حضور {counts.present}</span>
        </div>
      </div>

      <H>سجل الحضور والغياب</H>
      {history.length===0 ? <div className="hint">لا يوجد سجل حضور لهذا الطالب.</div>
        : <div className="card"><table className="tbl">
            <thead><tr><th>اليوم</th><th>التاريخ</th><th>وقت التسجيل</th><th>الحالة</th>{canManageAtt&&<th style={{width:1}}>تعديل</th>}</tr></thead>
            <tbody>{history.map(h=><tr key={h.date}>
              <td>{weekdayOf(h.date)}</td>
              <td>{fmtDate(h.date)}</td>
              <td>{h.at?fmtTime(h.at):"—"}</td>
              <td><span className={"pill "+h.status}>{statusLabel(h.status)}</span></td>
              {canManageAtt&&<td><div style={{display:"flex",gap:6}}>
                <select className="input" style={{padding:"5px 8px",width:"auto"}} value={h.status} onChange={e=>setDay(h.date,e.target.value)} aria-label="تغيير الحالة">
                  {["present","absent","late","excused"].map(k=><option key={k} value={k}>{statusLabel(k)}</option>)}
                </select>
                <button className="btn danger sm" onClick={()=>{delDay(h.date);toast("حُذف اليوم");}}>حذف</button>
              </div></td>}
            </tr>)}</tbody>
          </table></div>}

      <H>الملاحظات</H>
      <div style={{display:"flex",gap:8,marginBottom:10,flexWrap:"wrap"}}>
        <input className="input" style={{flex:1,minWidth:200}} value={note} onChange={e=>setNote(e.target.value)} placeholder="أضف ملاحظة عن الطالب…"/>
        <button className="btn" disabled={!note.trim()} onClick={()=>{addRec({kind:"note",text:note.trim()});setNote("");toast("أُضيفت الملاحظة");}}>إضافة</button>
      </div>
      {notes.length===0 ? <div className="hint">لا ملاحظات.</div>
        : notes.map(r=><div key={r.id} className="card pad" style={{padding:"11px 14px",marginBottom:8}}>
            <div style={{display:"flex",justifyContent:"space-between",gap:10,alignItems:"flex-start"}}>
              <div style={{fontSize:14}}>{r.text}</div>
              {canDelRec(r)&&<button className="x" style={{fontSize:18}} aria-label="حذف" onClick={()=>delRec(r.id)}>×</button>}
            </div>
            <div style={{fontSize:11.5,color:"var(--ink-faint)",marginTop:4}}>{r.byName||"—"} · {fmtDate(r.date)}{r.at?" · "+fmtTime(r.at):""}</div>
          </div>)}

      <H>المخالفات والسوابق</H>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(130px,1fr))",gap:8,marginBottom:8}}>
        <input className="input" value={itype} onChange={e=>setItype(e.target.value)} placeholder="النوع (سلوكية/نظام…)"/>
        <select className="input" value={sev} onChange={e=>setSev(e.target.value)} aria-label="الخطورة">
          <option value="low">بسيطة</option><option value="mid">متوسطة</option><option value="high">جسيمة</option>
        </select>
      </div>
      <div style={{display:"flex",gap:8,marginBottom:10,flexWrap:"wrap"}}>
        <input className="input" style={{flex:1,minWidth:200}} value={inc} onChange={e=>setInc(e.target.value)} placeholder="وصف المخالفة/السابقة…"/>
        <button className="btn accent" disabled={!inc.trim()} onClick={()=>{addRec({kind:"incident",text:inc.trim(),severity:sev,itype:itype.trim()});setInc("");setItype("");toast("سُجّلت المخالفة");}}>تسجيل</button>
      </div>
      {incidents.length===0 ? <div className="hint">لا مخالفات مسجّلة.</div>
        : incidents.map(r=><div key={r.id} className="card pad" style={{padding:"11px 14px",marginBottom:8,borderRight:"3px solid "+sevColor(r.severity)}}>
            <div style={{display:"flex",justifyContent:"space-between",gap:10,alignItems:"flex-start"}}>
              <div>
                <span className="tag" style={{background:sevColor(r.severity),color:"#fff",borderColor:"transparent"}}>{sevLabel(r.severity)}</span>
                {r.itype&&<span style={{fontSize:12.5,color:"var(--ink-soft)",marginRight:6}}>· {r.itype}</span>}
                <div style={{fontSize:14,marginTop:5}}>{r.text}</div>
              </div>
              {canDelRec(r)&&<button className="x" style={{fontSize:18}} aria-label="حذف" onClick={()=>delRec(r.id)}>×</button>}
            </div>
            <div style={{fontSize:11.5,color:"var(--ink-faint)",marginTop:4}}>{r.byName||"—"} · {fmtDate(r.date)}</div>
          </div>)}
    </Modal>
  );
}

/* ========================= STUDENTS ========================= */
function Students({state, commit, user}){
  const toast=useToast();
  const [q,setQ]=useState(""); const [fSec,setFSec]=useState("all");
  const [modal,setModal]=useState(null); // {mode:'add'|'edit'|'move', student}
  const [bulk,setBulk]=useState(false);
  const [rec,setRec]=useState(null);
  const [confirm,setConfirm]=useState(null);
  const secs=sectionsRange(state.meta.sectionsCount);

  const addBulk=(names,section)=>{
    const rows=names.map(n=>({id:uid(),name:n.trim(),section})).filter(r=>r.name.length>=2);
    if(!rows.length){ toast("لا توجد أسماء صالحة","err"); return; }
    commit(p=>({...p,students:[...p.students,...rows]}));
    toast(`أُضيف ${rows.length} طالب لشعبة ${section}`); setBulk(false);
  };

  const list = state.students
    .filter(s=>fSec==="all"||s.section===+fSec)

function Schedule({state, commit}){
  const toast=useToast();
  const secs=sectionsRange(state.meta.sectionsCount);
  const [sec,setSec]=useState(1);
  const [copyOpen,setCopyOpen]=useState(false);
  const rows=(state.examSchedules[sec]||[]).slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));

  const add=()=>{
    const row={id:uid(),date:todayISO(),subject:SUBJECTS[0],time:"08:00"};
    commit(p=>({...p,examSchedules:{...p.examSchedules,[sec]:[...(p.examSchedules[sec]||[]),row]}}));
  };
  const upd=(id,patch)=>commit(p=>({...p,examSchedules:{...p.examSchedules,[sec]:(p.examSchedules[sec]||[]).map(r=>r.id===id?{...r,...patch}:r)}}));
  const del=(id)=>commit(p=>({...p,examSchedules:{...p.examSchedules,[sec]:(p.examSchedules[sec]||[]).filter(r=>r.id!==id)}}));
  const copyTo=(targets)=>{
    const src=(state.examSchedules[sec]||[]);
    commit(p=>{
      const es={...p.examSchedules};
      targets.forEach(t=>{ es[t]=src.map(r=>({...r,id:uid()})); });
      return {...p,examSchedules:es};
    });
    setCopyOpen(false); toast(`نُسخ الجدول إلى ${targets.length} شعبة`);
  };

  return (
    <div className="rise">
      <div className="section-head">
        <div><h2>جدول الاختبارات</h2><p>حدّد مواعيد اختبارات كل شعبة، وانسخ الجدول لشُعب أخرى بضغطة.</p></div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <button className="btn ghost" onClick={()=>printSchedule(sec,rows,state)} disabled={!rows.length}>تصدير PDF</button>
          <button className="btn ghost" onClick={()=>setCopyOpen(true)} disabled={!rows.length}>نسخ لشُعب أخرى</button>
          <button className="btn" onClick={add}>+ إضافة اختبار</button>
        </div>
      </div>

      <div className="card pad" style={{marginBottom:16}}>
        <Field label="الشعبة" style={{margin:0,maxWidth:280}}>
          <select className="input" value={sec} onChange={e=>setSec(+e.target.value)}>
            {secs.map(n=><option key={n} value={n}>شعبة {n} — {gradeName(n,state.grades)}</option>)}
          </select>
        </Field>
      </div>

      {rows.length===0
        ? <div className="card"><div className="empty"><div className="big">▤</div>لا توجد اختبارات مجدولة لهذه الشعبة.</div></div>
        : <div className="card"><table className="tbl">
            <thead><tr><th>اليوم</th><th>التاريخ</th><th>الوقت</th><th>المادة</th><th style={{width:1}}></th></tr></thead>
            <tbody>{rows.map(r=><tr key={r.id}>
              <td>{weekdayOf(r.date)}</td>
              <td><input className="input" style={{padding:"6px 8px"}} type="date" value={r.date} onChange={e=>upd(r.id,{date:e.target.value})}/></td>
              <td><input className="input" style={{padding:"6px 8px",width:110}} type="time" value={r.time} onChange={e=>upd(r.id,{time:e.target.value})}/></td>
              <td><select className="input" style={{padding:"6px 8px"}} value={r.subject} onChange={e=>upd(r.id,{subject:e.target.value})}>
                {SUBJECTS.map(s=><option key={s}>{s}</option>)}</select></td>
              <td><button className="btn danger sm" onClick={()=>del(r.id)}>حذف</button></td>
            </tr>)}</tbody>
          </table></div>}

      {copyOpen && <CopySchedule secs={secs} current={sec} grades={state.grades} onClose={()=>setCopyOpen(false)} onCopy={copyTo}/>}
    </div>
  );
}
function CopySchedule({secs,current,grades,onClose,onCopy}){
  const [sel,setSel]=useState([]);
  const toggle=n=>setSel(sel.includes(n)?sel.filter(x=>x!==n):[...sel,n]);

        {secs.filter(n=>n!==current).map(n=><button type="button" key={n} aria-pressed={sel.includes(n)} className={"chk"+(sel.includes(n)?" on":"")} onClick={()=>toggle(n)}>شعبة {n} · {gradeName(n,grades)}</button>)}

    </Modal>
  );
}

function CommitteeForm({state, assigned, onClose, onCreate}){
  const toast=useToast();
  const {students,grades,meta}=state;
  const secs=sectionsRange(meta.sectionsCount);
  const [secA,setSecA]=useState(""); const [secB,setSecB]=useState("");
  const [nA,setNA]=useState(15); const [nB,setNB]=useState(15);
  const [subject,setSubject]=useState(""); const [date,setDate]=useState(""); const [venue,setVenue]=useState("");

  const availBySec = sec => students.filter(s=>s.section===+sec && !assigned.has(s.id));
  const gradeA = secA? gradeForSection(+secA,grades):null;
  // الشعبة B: تُستثنى الشُّعب من نفس صف A
  const bOptions = secs.filter(n=>{
    if(!secA) return false;
    if(n===+secA) return false;
    const g=gradeForSection(n,grades);
    return !(gradeA && g && g.id===gradeA.id); // نفس الصف مشطوب
  });

  const availA=secA?availBySec(secA):[];
  const availB=secB?availBySec(secB):[];
  const maxA=availA.length, maxB=availB.length;
  const okCounts = nA>=0 && nB>=0 && nA<=maxA && nB<=maxB && (nA+nB)>0;

  const half=()=>{ setNA(Math.min(15,maxA)); setNB(Math.min(15,maxB)); };

  const submit=()=>{
    if(!secA||!secB){ toast("اختر الشعبتين","err"); return; }
    if(!okCounts){ toast("تحقق من أعداد الطلاب","err"); return; }
    const ids=[...availA.slice(0,nA).map(s=>s.id), ...availB.slice(0,nB).map(s=>s.id)];
    onCreate({sectionA:+secA, sectionB:+secB, studentIds:ids, subject:subject.trim(), date, venue:venue.trim()});
  };

  return (
    <Modal title="تكوين لجنة جديدة" onClose={onClose} wide
      foot={<>
        <button className="btn accent" disabled={!okCounts||!secB} onClick={submit}>اعتماد اللجنة ({nA+nB} طالب)</button>
        <button className="btn ghost" onClick={onClose}>إلغاء</button>
      </>}>
      <div className="grid" style={{gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:14}}>
        <Field label="الشعبة الأولى (الاختيار 1)" style={{margin:0}}>
          <select className="input" value={secA} onChange={e=>{setSecA(e.target.value);setSecB("");}}>
            <option value="">— اختر —</option>
            {secs.map(n=><option key={n} value={n}>شعبة {n} · {gradeName(n,grades)} · متاح {availBySec(n).length}</option>)}
          </select>
        </Field>
        <Field label="الشعبة الثانية (الاختيار 2) — من صف مختلف" style={{margin:0}}>
          <select className="input" value={secB} onChange={e=>setSecB(e.target.value)} disabled={!secA}>

        <div className="banner warn" style={{marginTop:14}}>⚠ لا توجد شُعب متاحة من صفوف أخرى. عرّف صفوفاً مختلفة من الإعدادات.</div>}

        <div className="banner info" style={{marginTop:16,marginBottom:10}}>
          <span>⇄</span><div>التقسيم بين الشعبتين — المتاح: شعبة {secA} = {maxA} طالب · شعبة {secB} = {maxB} طالب. <button className="btn ghost sm" style={{marginRight:8}} onClick={half}>نص بنص</button></div>

            <input className="input" type="number" min="0" max={maxB} value={nB} onChange={e=>setNB(Math.max(0,+e.target.value||0))} aria-invalid={nB>maxB}/>
          </Field>
        </div>
        <div style={{textAlign:"center",margin:"6px 0 4px",fontFamily:"El Messiri",fontSize:18}}>حجم اللجنة: {nA+nB} طالب</div>
      </>}

      <div style={{borderTop:"1px solid var(--line)",margin:"18px 0 16px"}}/>
      <div className="grid" style={{gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:14}}>
        <Field label="المادة (اختياري)" style={{margin:0}}>
          <select className="input" value={subject} onChange={e=>setSubject(e.target.value)}>
            <option value="">— بدون —</option>{SUBJECTS.map(s=><option key={s}>{s}</option>)}
          </select></Field>
        <Field label="التاريخ (اختياري)" style={{margin:0}}>
          <input className="input" type="date" value={date} onChange={e=>setDate(e.target.value)}/></Field>

        <input className="input" value={venue} onChange={e=>setVenue(e.target.value)} placeholder="مثال: قاعة 3 — الدور الأول"/></Field>
    </Modal>
  );
}

function VerifyModal({state,onClose}){
  const {committees,students,grades}=state;
  const issues=[];
  const seen={};
  committees.forEach(c=>{
    c.studentIds.forEach(id=>{
      if(seen[id]!==undefined){
        const nm=(students.find(s=>s.id===id)||{}).name||id;
        issues.push(`الطالب «${nm}» موجود في لجنتين (${seen[id]} و ${c.number}).`);
      } else seen[id]=c.number;
    });
    const gA=gradeForSection(c.sectionA,grades), gB=gradeForSection(c.sectionB,grades);
    if(gA&&gB&&gA.id===gB.id) issues.push(`لجنة ${c.number}: الشعبتان من نفس الصف (${gA.name}).`);
    const missing=c.studentIds.filter(id=>!students.find(s=>s.id===id));
    if(missing.length) issues.push(`لجنة ${c.number}: ${missing.length} طالب محذوف من النظام.`);
  });
  return (
    <Modal title="نتيجة التحقّق" onClose={onClose}
      foot={<button className="btn" onClick={onClose}>تم</button>}>
      {issues.length===0
        ? <div style={{textAlign:"center",padding:"20px 0"}}>
            <div style={{fontSize:44,color:"var(--ok)"}}>✓</div>
            <h3 style={{margin:"6px 0"}}>القواعد سليمة</h3>
            <p style={{color:"var(--ink-soft)",margin:0}}>لا يوجد طالب مكرر، وكل اللجان تجمع صفوفاً مختلفة.</p>
          </div>
        : <div>
            <div className="banner warn"><span>⚠</span><div>وُجدت {issues.length} مشكلة:</div></div>
            <ul style={{margin:0,paddingRight:18,lineHeight:2}}>{issues.map((x,i)=><li key={i} style={{fontSize:14}}>{x}</li>)}</ul>
          </div>}
    </Modal>
  );
}

function openPrint(title, innerHTML){

  <link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">

function printStudentRecord(student, state){
  const {grades,meta,attendance,attMeta,records}=state;
  const history=Object.keys(attendance).filter(d=>attendance[d][student.id]!==undefined)
    .map(d=>({date:d,status:attendance[d][student.id],at:((attMeta||{})[d]||{})[student.id]}))
    .sort((a,b)=>b.date.localeCompare(a.date));
  const counts={present:0,absent:0,late:0,excused:0}; history.forEach(h=>counts[h.status]!==undefined&&counts[h.status]++);
  const recs=(records||[]).filter(r=>r.studentId===student.id);
  const notes=recs.filter(r=>r.kind==="note"), incidents=recs.filter(r=>r.kind==="incident");
  const secH = t => `<h3 style="color:#1f5d4f;font-family:'El Messiri';font-size:16px;margin:20px 0 6px">${t}</h3>`;
  const none = t => `<div style="color:#8a8478;font-size:13px">${t}</div>`;
  const attRows=history.map(h=>`<tr><td>${esc(weekdayOf(h.date))}</td><td>${esc(fmtDate(h.date))}</td><td>${h.at?esc(fmtTime(h.at)):"—"}</td><td>${esc(statusLabel(h.status))}</td></tr>`).join("");
  const noteRows=notes.map(r=>`<tr><td class="name">${esc(r.text)}</td><td>${esc(r.byName||"")}</td><td>${esc(fmtDate(r.date))}</td></tr>`).join("");
  const incRows=incidents.map(r=>`<tr><td>${esc(sevLabel(r.severity))}</td><td>${esc(r.itype||"—")}</td><td class="name">${esc(r.text)}</td><td>${esc(fmtDate(r.date))}</td></tr>`).join("");
  const inner = printHead({schoolName:meta.schoolName, title:"السجل الدراسي للطالب", subtitle:`${student.name} — شعبة ${student.section} — ${gradeName(student.section,grades)}`, badge:{k:"الغياب", v:counts.absent}})
    + printMeta([{k:"الطالب",v:student.name},{k:"الغياب",v:counts.absent},{k:"التأخير",v:counts.late},{k:"بعذر",v:counts.excused},{k:"المخالفات",v:incidents.length}])
    + secH("سجل الحضور والغياب")
    + (history.length?`<table class="tbl"><thead><tr><th>اليوم</th><th>التاريخ</th><th>وقت التسجيل</th><th>الحالة</th></tr></thead><tbody>${attRows}</tbody></table>`:none("لا يوجد سجل حضور."))
    + secH("الملاحظات")
    + (notes.length?`<table class="tbl"><thead><tr><th>الملاحظة</th><th>بواسطة</th><th>التاريخ</th></tr></thead><tbody>${noteRows}</tbody></table>`:none("لا ملاحظات."))
    + secH("المخالفات والسوابق")
    + (incidents.length?`<table class="tbl"><thead><tr><th>الخطورة</th><th>النوع</th><th>الوصف</th><th>التاريخ</th></tr></thead><tbody>${incRows}</tbody></table>`:none("لا مخالفات مسجّلة."))
    + printFoot(meta.schoolName);
  openPrint("سجل "+student.name, inner);
}

/* ========================= PROFILE (حسابي) ========================= */
function Profile({user, commit, onUserUpdate}){
  const toast=useToast();
  const [name,setName]=useState(user.name);
  const [savingName,setSavingName]=useState(false);
  const [cur,setCur]=useState(""); const [np,setNp]=useState(""); const [np2,setNp2]=useState("");
  const [savingPass,setSavingPass]=useState(false);

  const saveName=async()=>{
    const nm=name.trim(); if(nm.length<2){ toast("الاسم قصير جداً","err"); return; }
    setSavingName(true);
    try{
      if(FIREBASE_READY){ await fdb.collection(USERS_COL).doc(user.id).update({name:nm}); }
      else { commit(p=>({...p,users:(p.users||[]).map(u=>u.id===user.id?{...u,name:nm}:u)})); }
      onUserUpdate({name:nm}); toast("تم تحديث الاسم");
    }catch(e){ toast("تعذّر الحفظ — تأكد من قواعد الأمان","err"); }
    finally{ setSavingName(false); }
  };

  const savePass=async()=>{
    if(np.length<6){ toast("كلمة المرور 6 خانات على الأقل","err"); return; }
    if(np!==np2){ toast("كلمتا المرور غير متطابقتين","err"); return; }
    setSavingPass(true);
    try{
      if(FIREBASE_READY){
        const u=fauth.currentUser;
        const cred=firebase.auth.EmailAuthProvider.credential(u.email, cur);
        await u.reauthenticateWithCredential(cred);
        await u.updatePassword(np);
      } else {
        commit(p=>({...p,users:(p.users||[]).map(x=>x.id===user.id?{...x,password:np}:x)}));
      }
      setCur("");setNp("");setNp2(""); toast("تم تغيير كلمة المرور");
    }catch(ex){
      const c=(ex&&ex.code)||"";
      toast((c.includes("wrong-password")||c.includes("invalid-credential"))?"كلمة المرور الحالية غير صحيحة":
            c.includes("requires-recent-login")?"لأمانك، سجّل خروج ثم دخول وحاول مجدداً":
            c.includes("weak-password")?"كلمة المرور ضعيفة":"تعذّر تغيير كلمة المرور","err");
    }finally{ setSavingPass(false); }
  };

  return (
    <div className="rise" style={{maxWidth:620}}>
      <div className="section-head"><div><h2>حسابي</h2><p>عدّل اسمك وكلمة مرورك.</p></div></div>

      <div className="card pad" style={{marginBottom:18}}>
        <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:18}}>
          <div className="av" style={{width:54,height:54,borderRadius:16,fontSize:24}}>{user.name.slice(0,1)}</div>
          <div>
            <div style={{fontFamily:"El Messiri",fontSize:20,fontWeight:700}}>{user.name}</div>
            <div style={{fontSize:13,color:"var(--ink-soft)"}}>
              اسم المستخدم: <b>{user.username}</b> · الصلاحية: <span className={"tag "+(user.role==="manager"?"accent":"brand")}>{roleLabel(user.role)}</span>
            </div>
          </div>
        </div>
        <Field label="الاسم"><input className="input" value={name} onChange={e=>setName(e.target.value)}/></Field>
        <div className="hint" style={{marginBottom:14}}>اسم المستخدم والصلاحية يغيّرهما المدير فقط.</div>
        <button className="btn" onClick={saveName} disabled={savingName||name.trim()===user.name||name.trim().length<2}>{savingName?"جارٍ…":"حفظ الاسم"}</button>
      </div>

      <div className="card pad">
        <h3 style={{marginTop:0}}>تغيير كلمة المرور</h3>
        {FIREBASE_READY &&
          <Field label="كلمة المرور الحالية"><input className="input" type="password" autoComplete="current-password" value={cur} onChange={e=>setCur(e.target.value)}/></Field>}
        <Field label="كلمة المرور الجديدة" hint="6 خانات على الأقل"><input className="input" type="password" autoComplete="new-password" value={np} onChange={e=>setNp(e.target.value)}/></Field>
        <Field label="تأكيد كلمة المرور الجديدة"><input className="input" type="password" autoComplete="new-password" value={np2} onChange={e=>setNp2(e.target.value)}/></Field>
        <button className="btn accent" onClick={savePass} disabled={savingPass||!np||(FIREBASE_READY&&!cur)}>{savingPass?"جارٍ…":"تغيير كلمة المرور"}</button>
      </div>
    </div>
  );
}

          <button className="btn ghost sm" onClick={addG}>+ صف</button>
        </div>
        <p style={{color:"var(--ink-soft)",fontSize:13,marginTop:0}}>حدّد لكل صف من أي شعبة إلى أي شعبة (مثال: أول ثانوي من 1 إلى 6).</p>
        {grades.map(g=><div key={g.id} style={{display:"flex",gap:10,alignItems:"flex-end",marginBottom:10,flexWrap:"wrap"}}>
          <Field label="اسم الصف" style={{margin:0,flex:1,minWidth:150}}>
            <input className="input" value={g.name} onChange={e=>updG(g.id,{name:e.target.value})}/></Field>
          <Field label="من" style={{margin:0,width:90}}>
            <input className="input" type="number" min="1" value={g.from} onChange={e=>updG(g.id,{from:+e.target.value})}/></Field>
          <Field label="إلى" style={{margin:0,width:90}}>
            <input className="input" type="number" min="1" value={g.to} onChange={e=>updG(g.id,{to:+e.target.value})}/></Field>
          <button className="btn danger sm" style={{marginBottom:15}} onClick={()=>delG(g.id)} aria-label={"حذف صف "+g.name}>حذف</button>
        </div>)}
        <button className="btn" style={{marginTop:8}} onClick={saveMeta}>حفظ الإعدادات</button>
      </div>
    </div>
  );
}

/* ========================= ACCOUNTS ========================= */
function Accounts(props){
  return FIREBASE_READY ? <AccountsCloud me={props.user}/> : <AccountsLocal {...props}/>;
}

function AccountsCloud({me}){
  const toast=useToast();
  const [users,setUsers]=useState(null);
  const [modal,setModal]=useState(null);
  const [confirm,setConfirm]=useState(null);
  const [busy,setBusy]=useState(false);

  useEffect(()=>{
    const unsub=fdb.collection(USERS_COL).onSnapshot(
      snap=>setUsers(snap.docs.map(d=>({id:d.id,...d.data()}))),
      e=>{ console.warn(e); setUsers([]); toast("تعذّر تحميل الحسابات","err"); }
    );
    return unsub;
  },[]);

  const create=async(data)=>{
    setBusy(true);
    try{
      await createAuthAccount(data);
      toast("تم إنشاء الحساب بأمان"); setModal(null);
    }catch(ex){
      const c=(ex&&ex.code)||"";
      toast(c.includes("email-already-in-use")?"اسم المستخدم مستخدم مسبقاً":
            c.includes("weak-password")?"كلمة المرور ضعيفة (6 خانات على الأقل)":
            c.includes("operation-not-allowed")?"فعّل «Email/Password» في Firebase Auth":
            "تعذّر الإنشاء: "+(ex.message||c),"err");
    }finally{ setBusy(false); }
  };
  const saveEdit=async(id,data)=>{
    try{ await fdb.collection(USERS_COL).doc(id).update({name:data.name.trim(),role:data.role}); toast("تم الحفظ"); setModal(null); }
    catch(e){ toast("تعذّر الحفظ","err"); }
  };
  const remove=async(u)=>{
    try{ await fdb.collection(USERS_COL).doc(u.id).delete(); toast("تم تعطيل الحساب","err"); }
    catch(e){ toast("تعذّر الحذف","err"); }
  };

  return (
    <div className="rise" style={{maxWidth:820}}>
      <div className="section-head">
        <div><h2>الحسابات</h2><p>حسابات آمنة عبر Firebase Authentication — كلمات المرور مشفّرة ولا تُخزَّن في قاعدة البيانات.</p></div>
        <button className="btn" onClick={()=>setModal({mode:"add"})}>+ حساب جديد</button>
      </div>

      <div className="banner info"><span>🔒</span><div>الدخول محميّ بالمصادقة الفعلية. حذف الحساب هنا يمنع دخوله فوراً. لإزالته نهائياً احذفه أيضاً من Firebase Console → Authentication.</div></div>

      {users===null
        ? <div className="card"><div className="empty">جاري تحميل الحسابات…</div></div>
        : <div className="card"><table className="tbl">
            <thead><tr><th>الاسم</th><th>اسم المستخدم</th><th>الصلاحية</th><th style={{width:1}}></th></tr></thead>
            <tbody>{users.map(u=><tr key={u.id}>
              <td style={{fontWeight:600}}>{u.name}</td>
              <td style={{color:"var(--ink-soft)"}}>{u.username}</td>
              <td><span className={"tag "+(u.role==="manager"?"accent":"brand")}>{roleLabel(u.role)}</span></td>
              <td><div style={{display:"flex",gap:6}}>
                <button className="btn ghost sm" onClick={()=>setModal({mode:"edit",u})}>تعديل</button>
                {u.id!==me.id && <button className="btn danger sm" onClick={()=>setConfirm({text:`تعطيل حساب «${u.name}»؟ لن يستطيع الدخول بعدها.`,onYes:()=>remove(u)})}>تعطيل</button>}
              </div></td>
            </tr>)}</tbody>
          </table></div>}

      {modal && <CloudAccountForm mode={modal.mode} u={modal.u} busy={busy}
        onClose={()=>setModal(null)}
        onSave={data=> modal.mode==="add" ? create(data) : saveEdit(modal.u.id,data)}/>}
      {confirm && <Confirm {...confirm} danger onClose={()=>setConfirm(null)}/>}
    </div>
  );
}
function CloudAccountForm({mode,u,busy,onClose,onSave}){
  const [name,setName]=useState(u?.name||"");
  const [username,setUsername]=useState(u?.username||"");
  const [password,setPassword]=useState("");
  const [role,setRole]=useState(u?.role||"deputy");
  const isAdd=mode==="add";
  const valid=name.trim() && (!isAdd || (username.trim() && password.length>=6));
  return (
    <Modal title={isAdd?"حساب جديد":"تعديل الحساب"} onClose={onClose}
      foot={<><button className="btn" disabled={!valid||busy} onClick={()=>onSave({name,username,password,role})}>{busy?"جارٍ…":"حفظ"}</button>
        <button className="btn ghost" onClick={onClose}>إلغاء</button></>}>
      <Field label="الاسم"><input className="input" value={name} onChange={e=>setName(e.target.value)}/></Field>
      {isAdd
        ? <>
            <Field label="اسم المستخدم" hint="يُستخدم للدخول (حروف إنجليزية/أرقام بدون مسافات)">
              <input className="input" value={username} onChange={e=>setUsername(e.target.value)} placeholder="wakeel2"/></Field>
            <Field label="كلمة المرور" hint="6 خانات على الأقل">
              <input className="input" type="password" value={password} onChange={e=>setPassword(e.target.value)}/></Field>
          </>
        : <Field label="اسم المستخدم"><input className="input" value={username} disabled/></Field>}
      <Field label="الصلاحية" style={{margin:0}}>
        <select className="input" value={role} onChange={e=>setRole(e.target.value)}>
          <option value="manager">مدير — كامل الصلاحيات</option>
          <option value="deputy">وكيل</option>
          <option value="teacher">معلم</option>
        </select></Field>
    </Modal>
  );
}
function AccountsLocal({state, commit, user}){
  const toast=useToast();
  const [modal,setModal]=useState(null);
  const [confirm,setConfirm]=useState(null);
  const save=(data)=>{
    if(modal.mode==="add"){
      if(state.users.some(u=>u.username===data.username)){ toast("اسم المستخدم موجود","err"); return; }
      commit(p=>({...p,users:[...p.users,{id:uid(),...data}]})); toast("تم إنشاء الحساب");
    } else {
      commit(p=>({...p,users:p.users.map(u=>u.id===modal.u.id?{...u,...data}:u)})); toast("تم الحفظ");
    }
    setModal(null);
  };
  const remove=u=>{ commit(p=>({...p,users:p.users.filter(x=>x.id!==u.id)})); toast("تم حذف الحساب","err"); };
  return (
    <div className="rise" style={{maxWidth:820}}>
      <div className="section-head">
        <div><h2>الحسابات</h2><p>إدارة حسابات المدير والوكلاء والمعلمين.</p></div>
        <button className="btn" onClick={()=>setModal({mode:"add"})}>+ حساب جديد</button>
      </div>
      <div className="card"><table className="tbl">
        <thead><tr><th>الاسم</th><th>اسم المستخدم</th><th>الصلاحية</th><th style={{width:1}}></th></tr></thead>
        <tbody>{state.users.map(u=><tr key={u.id}>
          <td style={{fontWeight:600}}>{u.name}</td>
          <td style={{color:"var(--ink-soft)"}}>{u.username}</td>
          <td><span className={"tag "+(u.role==="manager"?"accent":"brand")}>{roleLabel(u.role)}</span></td>
          <td><div style={{display:"flex",gap:6}}>
            <button className="btn ghost sm" onClick={()=>setModal({mode:"edit",u})}>تعديل</button>
            {u.id!==user.id && <button className="btn danger sm" onClick={()=>setConfirm({text:`حذف حساب «${u.name}»؟`,onYes:()=>remove(u)})}>حذف</button>}
          </div></td>
        </tr>)}</tbody>
      </table></div>
      {modal && <AccountForm mode={modal.mode} u={modal.u} onClose={()=>setModal(null)} onSave={save}/>}
      {confirm && <Confirm {...confirm} danger onClose={()=>setConfirm(null)}/>}
    </div>
  );
}
function AccountForm({mode,u,onClose,onSave}){
  const [name,setName]=useState(u?.name||"");
  const [username,setUsername]=useState(u?.username||"");
  const [password,setPassword]=useState(u?.password||"");
  const [role,setRole]=useState(u?.role||"deputy");
  const valid=name.trim()&&username.trim()&&password;
  return (
    <Modal title={mode==="add"?"حساب جديد":"تعديل الحساب"} onClose={onClose}
      foot={<><button className="btn" disabled={!valid} onClick={()=>onSave({name:name.trim(),username:username.trim(),password,role})}>حفظ</button>
        <button className="btn ghost" onClick={onClose}>إلغاء</button></>}>
      <Field label="الاسم"><input className="input" value={name} onChange={e=>setName(e.target.value)}/></Field>
      <Field label="اسم المستخدم"><input className="input" name="username" autoComplete="off" value={username} onChange={e=>setUsername(e.target.value)}/></Field>
      <Field label="كلمة المرور"><input className="input" value={password} onChange={e=>setPassword(e.target.value)}/></Field>
      <Field label="الصلاحية" style={{margin:0}}>
        <select className="input" value={role} onChange={e=>setRole(e.target.value)}>
          <option value="manager">مدير — كامل الصلاحيات</option>
          <option value="deputy">وكيل</option>
          <option value="teacher">معلم</option>
        </select></Field>
    </Modal>
  );
}

/* ========================= APP ========================= */
function App(){
  const [user,setUser]=useState(null);
  const [authReady,setAuthReady]=useState(!FIREBASE_READY);
  const [authErr,setAuthErr]=useState("");
  const [state,commit]=useStore(!!user);

  useEffect(()=>{
    if(!fauth) return;
    const unsub=fauth.onAuthStateChanged(async fbUser=>{
      if(!fbUser){ setUser(null); setAuthReady(true); return; }
      try{
        const doc=await fdb.collection(USERS_COL).doc(fbUser.uid).get();
        if(doc.exists){ setUser({id:fbUser.uid, ...doc.data()}); }
        else { setAuthErr("تم الدخول لكن لا يوجد ملف صلاحيات لحسابك. راجع المدير."); await fauth.signOut(); setUser(null); }
      }catch(e){ setAuthErr("تعذّر تحميل الصلاحيات. تأكد من قواعد الأمان في Firestore."); try{await fauth.signOut();}catch(_){} setUser(null); }
      setAuthReady(true);
    });
    return unsub;
  },[]);

  const logout=()=>{ if(fauth){ fauth.signOut(); } setUser(null); };
  const loading = <div style={{display:"grid",placeItems:"center",height:"100vh",color:"var(--ink-soft)"}}>جاري التحميل…</div>;

  if(!authReady) return loading;
  if(!user){
    if(!FIREBASE_READY && !state) return loading;
    return <ToastHost><Login localUsers={FIREBASE_READY?null:state.users} onLocalLogin={setUser} authErr={authErr} setAuthErr={setAuthErr}/></ToastHost>;
  }
  if(!state) return loading;
  return <ToastHost><Shell state={state} commit={commit} user={user} onLogout={logout} onUserUpdate={patch=>setUser(u=>({...u,...patch}))}/></ToastHost>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
